version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: fund-reconciliation-postgres
    environment:
      POSTGRES_USER: fund_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fund_password}
      POSTGRES_DB: fund_reconciliation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fund-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fund-reconciliation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fund-network

  # Fund Reconciliation API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fund-reconciliation-api
    environment:
      MODE: api
      DATABASE_URL: postgresql://fund_user:${DB_PASSWORD:-fund_password}@postgres:5432/fund_reconciliation
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./output:/app/output
      - ./alembic:/app/alembic
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - fund-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fund-reconciliation-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fund-network

  # Adminer for Redis Management
  adminer-redis:
    image: redis-commander:latest
    container_name: fund-reconciliation-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - fund-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fund-network:
    driver: bridge
