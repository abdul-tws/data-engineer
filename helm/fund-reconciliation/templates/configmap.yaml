apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fund-reconciliation.fullname" . }}
  labels:
    {{- include "fund-reconciliation.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MODE: {{ .Values.app.mode | quote }}
  APP_TITLE: "Fund Reconciliation System"
  API_VERSION: "v1"
  CORS_ALLOW_ORIGINS: {{ .Values.app.corsAllowedOrigins | join "," | quote }}
  MAX_UPLOAD_SIZE: {{ .Values.app.maxUploadSize | quote }}
  {{- if .Values.database.enabled }}
  DB_TYPE: {{ .Values.database.type | quote }}
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  DB_SSL: {{ .Values.database.ssl | quote }}
  DB_MAX_CONNECTIONS: {{ .Values.database.maxConnections | quote }}
  DB_POOL_SIZE: {{ .Values.database.poolSize | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_DB: {{ .Values.redis.db | quote }}
  {{- end }}
  {{- with .Values.config }}
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
