{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fund-reconciliation.fullname" . }}
  labels:
    {{- include "fund-reconciliation.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.database.enabled }}
  {{- if .Values.secrets.databasePassword }}
  database-url: {{ printf "%s://%s:%s@%s:%d/%s?sslmode=%s" .Values.database.type .Values.database.username .Values.secrets.databasePassword .Values.database.host .Values.database.port .Values.database.name (ternary "require" "disable" .Values.database.ssl) | b64enc }}
  {{- end }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  {{- if .Values.secrets.redisPassword }}
  redis-url: {{ printf "redis://:%s@%s:%d/%d" .Values.secrets.redisPassword .Values.redis.host .Values.redis.port .Values.redis.db | b64enc }}
  {{- end }}
  {{- end }}
  {{- if .Values.secrets.apiKey }}
  api-key: {{ .Values.secrets.apiKey | b64enc }}
  {{- end }}
{{- end }}
