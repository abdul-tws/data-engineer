# Production environment overrides
global:
  environment: production
  logLevel: WARN

image:
  tag: "2.0.0"
  pullPolicy: Always

replicaCount: 3

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: "fund-reconciliation.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fund-reconciliation-prod-tls
      hosts:
        - "fund-reconciliation.example.com"

database:
  enabled: true
  type: postgresql
  host: postgres-prod.default.svc.cluster.local
  ssl: true
  maxConnections: 30
  poolSize: 20

redis:
  enabled: true
  host: redis-prod.default.svc.cluster.local
  port: 6379

persistence:
  enabled: true
  data:
    size: 50Gi
    storageClass: "fast-ssd"
  output:
    size: 20Gi
    storageClass: "fast-ssd"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30

nodeSelector:
  workload: data-processing

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - fund-reconciliation
        topologyKey: kubernetes.io/hostname

tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "data-processing"
    effect: "NoSchedule"
