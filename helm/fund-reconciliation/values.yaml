# Default values for fund-reconciliation
# This is a YAML-formatted file

# Global settings
global:
  environment: production
  logLevel: INFO

# Image configuration
image:
  repository: fund-reconciliation
  pullPolicy: IfNotPresent
  tag: "2.0.0"  # Overrides the image tag; defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# API Service
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "fund-reconciliation.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fund-reconciliation-tls
      hosts:
        - "fund-reconciliation.example.com"

# Deployment configuration
replicaCount: 3

# Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Node selection
nodeSelector: {}

# Pod affinity and anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - fund-reconciliation
          topologyKey: kubernetes.io/hostname

# Tolerations
tolerations: []

# Database configuration
database:
  enabled: true
  type: postgresql  # postgresql, mysql, sqlite
  host: postgres.default.svc.cluster.local
  port: 5432
  name: fund_reconciliation
  username: fund_user
  # password: set via secrets
  ssl: true
  maxConnections: 20
  poolSize: 10

# Redis configuration (for caching)
redis:
  enabled: false
  host: redis.default.svc.cluster.local
  port: 6379
  db: 0
  # password: set via secrets

# Application configuration
app:
  mode: api  # api or e2e
  logLevel: INFO
  corsAllowedOrigins:
    - "*"
  maxUploadSize: 10485760  # 10MB in bytes
  
# Data paths
volumes:
  data:
    enabled: true
    size: 10Gi
    storageClass: standard
  output:
    enabled: true
    size: 5Gi
    storageClass: standard

# Probes configuration
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Persistence configuration
persistence:
  enabled: true
  data:
    size: 10Gi
    storageClass: "standard"
    accessMode: ReadWriteOnce
  output:
    size: 5Gi
    storageClass: "standard"
    accessMode: ReadWriteOnce

# Config map data
config:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Secrets (base64 encoded or reference existing secrets)
secrets:
  # createSecret: true
  # databasePassword: ""
  # redisPassword: ""
  # apiKey: ""
  existingSecret: ""  # Reference existing secret instead

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics

# Backup configuration
backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 30  # days

# Migration configuration
migration:
  enabled: true
  autoRunMigrations: true
  
